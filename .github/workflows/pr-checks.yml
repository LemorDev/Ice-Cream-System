name: PR checks

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm --dir apps/web-ims lint
      - run: pnpm --dir apps/web-ims test
      - run: pnpm --dir apps/web-ims build:development
        env:
          VITE_APP_ENV: development
          VITE_SUPABASE_URL: https://ci-development.invalid
          VITE_SUPABASE_ANON_KEY: ci-public-placeholder
          VITE_SUPABASE_PRODUCTION_URL: https://ci-production.invalid

  database:
    name: Database checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix apps/android-pos/app/build/sql-test-runtime --no-audit --no-fund --package-lock=false @electric-sql/pglite@0.5.8
      - run: node supabase/tests/pos_stock_receiving.integration.mjs --extended --activation

  android:
    name: Android checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure isolated CI endpoints
        run: |
          cat > local.properties <<'EOF'
          supabase.dev.url=https://ci-development.invalid
          supabase.dev.anonKey=ci-public-placeholder
          supabase.production.url=https://ci-production.invalid
          supabase.production.anonKey=ci-public-placeholder
          EOF
        working-directory: apps/android-pos
      - run: bash ./gradlew :app:testDevDebugUnitTest :app:assembleDevDebug --no-daemon
        working-directory: apps/android-pos
